title = "NEXUS-Q gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Public deterministic test-key fixtures shipped by vendored RustCrypto ML-KEM and ML-DSA crates; these are test vectors, not credentials."
paths = [
  '''vendor/ml-kem/tests/examples/.*\.priv''',
  '''vendor/ml-dsa/tests/examples/.*\.priv''',
]


[[allowlists]]
description = "Known false positive for the historical AWS-LC CPU-feature identifier validator"
condition = "AND"
regexTarget = "line"
regexes = ['''strspn\(token, "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"\s*"0123456789_-"\) != strlen\(token\)''']
paths = ['''arena/adapters/aws-lc/runner[.]c''']
commits = ["e175fba0300a422ee368c816b54fbfc40aaf44ea"]
