[package]
name = "nexusq-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3.27"
nexusq-core = { path = "../crates/nexusq-core" }

[[bin]]
name = "vault_parse"
path = "fuzz_targets/vault_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_parse"
path = "fuzz_targets/envelope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_body_decode"
path = "fuzz_targets/vault_body_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_event_decode"
path = "fuzz_targets/audit_event_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_segment_decode"
path = "fuzz_targets/audit_segment_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "credential_decode"
path = "fuzz_targets/credential_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_import"
path = "fuzz_targets/backup_import.rs"
test = false
doc = false
bench = false

[workspace]

# This directory is an independent Cargo workspace, so it must repeat the
# workspace's local PQC patches. Otherwise fuzz builds resolve crates.io
# ml-dsa, which does not provide NEXUS-Q's `nexusq-kernels` feature.
[patch.crates-io]
ml-dsa = { path = "../vendor/ml-dsa" }
ml-kem = { path = "../vendor/ml-kem" }
module-lattice = { path = "../vendor/module-lattice" }
nexusq-kernels = { path = "../crates/nexusq-kernels" }
