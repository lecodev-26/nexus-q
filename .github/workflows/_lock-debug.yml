name: temporary lock debug
on:
  workflow_dispatch:
  push:
    branches:
      - v2/final-security-audit-hardening
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lock offline and print diff
        run: |
          cargo generate-lockfile --offline
          git diff -- Cargo.lock
          git diff --exit-code -- Cargo.lock
