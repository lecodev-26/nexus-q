name: NEXUS-Q Fast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref or commit SHA to validate'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nexusq-fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Rust workspace — fast checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce unsafe-code SAFETY policy
        run: python3 .github/scripts/check-unsafe-policy.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
