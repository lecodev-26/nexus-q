name: NEXUS-Q Sequential Four-Hour Fuzz Campaigns

on:
  workflow_call:

permissions:
  contents: read

# Each campaign is deliberately a single libFuzzer invocation. Do not wrap it
# in retry/restart loops: libFuzzer owns the four-hour limit and exits normally.
jobs:
  fuzz-soak-vault:
    name: four-hour fuzz campaign — vault parser
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run vault parser campaign for four hours
        run: cargo fuzz run vault_parse -- -max_total_time=14400 -timeout=30
        working-directory: fuzz

  fuzz-soak-envelope:
    name: four-hour fuzz campaign — envelope parser
    needs: fuzz-soak-vault
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run envelope parser campaign for four hours
        run: cargo fuzz run envelope_parse -- -max_total_time=14400 -timeout=30
        working-directory: fuzz

  fuzz-soak-backup:
    name: four-hour fuzz campaign — backup importer
    needs: fuzz-soak-envelope
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run backup importer campaign for four hours
        run: cargo fuzz run backup_import -- -max_total_time=14400 -timeout=30
        working-directory: fuzz
