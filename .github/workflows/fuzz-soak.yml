name: NEXUS-Q Bounded Sequential Fuzz Campaigns

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fuzz-soak-vault:
    name: bounded fuzz run — vault parser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz vault parser with a hard 10-minute limit
        run: timeout --signal=INT --kill-after=30s 10m cargo fuzz run vault_parse -- -max_total_time=540
        working-directory: fuzz

  fuzz-soak-envelope:
    name: bounded fuzz run — envelope parser
    needs: fuzz-soak-vault
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz envelope parser with a hard 10-minute limit
        run: timeout --signal=INT --kill-after=30s 10m cargo fuzz run envelope_parse -- -max_total_time=540
        working-directory: fuzz

  fuzz-soak-backup:
    name: bounded fuzz run — backup importer
    needs: fuzz-soak-envelope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz backup importer with a hard 10-minute limit
        run: timeout --signal=INT --kill-after=30s 10m cargo fuzz run backup_import -- -max_total_time=540
        working-directory: fuzz
