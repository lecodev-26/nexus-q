name: NEXUS-Q Manual Repository and Secret Checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusq-manual-repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts and safety boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Arena JSON and required contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("arena").rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          required = [
              Path("arena/registry/algorithms.json"),
              Path("arena/registry/implementations.json"),
              Path("arena/registry/matrix.json"),
              Path("arena/schemas/benchmark-result.schema.json"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing Arena contracts: {missing}")
          print(f"Validated {len(files)} Arena JSON files and all required contracts")
          PY
      - name: Enforce unsafe-code boundaries
        run: |
          python3 .github/scripts/check-kernel-unsafe.py
          python3 .github/scripts/check-native-backend-unsafe.py

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
