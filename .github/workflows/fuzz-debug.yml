name: Fuzz Debug

on:
  push:
    branches: [debug/fuzz-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-build:
    name: Fuzz harness build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
        working-directory: fuzz

  fuzz-smoke:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    needs: fuzz-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Vault parser smoke
        run: cargo fuzz run vault_parse -- -max_total_time=60
        working-directory: fuzz
      - name: Envelope parser smoke
        run: cargo fuzz run envelope_parse -- -max_total_time=60
        working-directory: fuzz
