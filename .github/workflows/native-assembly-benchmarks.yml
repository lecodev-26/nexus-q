name: NEXUS-Q Native Assembly Performance Gate

on:
  workflow_dispatch:
  push:
    branches: ["perf/issue-48-native-assembly-gate"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "vendor/**"
      - "arena/runners/nexusq/**"
      - "arena/adapters/aws-lc/**"
      - "arena/scripts/evaluate_native_assembly_gate.py"
      - ".github/workflows/native-assembly-benchmarks.yml"
  pull_request:
    branches: ["nexusqv4"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "vendor/**"
      - "arena/runners/nexusq/**"
      - "arena/adapters/aws-lc/**"
      - "arena/scripts/evaluate_native_assembly_gate.py"
      - ".github/workflows/native-assembly-benchmarks.yml"

permissions:
  contents: read

concurrency:
  group: native-assembly-benchmarks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark-gate:
    name: Nine operations / three alternating rounds / median and p95
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install AWS-LC build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential
      - name: Record host and toolchain metadata
        run: |
          mkdir -p arena/results/ci/native-assembly
          lscpu | tee arena/results/ci/native-assembly/lscpu.txt
          rustc -Vv | tee arena/results/ci/native-assembly/rustc.txt
          cargo -V | tee arena/results/ci/native-assembly/cargo.txt
          git rev-parse HEAD | tee arena/results/ci/native-assembly/revision.txt
          sha256sum arena/runners/nexusq/Cargo.lock | tee arena/results/ci/native-assembly/nexusq-lock.sha256
      - name: Fetch pinned AWS-LC source
        run: |
          git init .arena-aws-lc
          git -C .arena-aws-lc remote add origin https://github.com/aws/aws-lc.git
          git -C .arena-aws-lc fetch --depth 1 origin ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba
          git -C .arena-aws-lc checkout --detach ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba
          test "$(git -C .arena-aws-lc rev-parse HEAD)" = "ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba"
      - name: Build pinned AWS-LC
        run: |
          cmake -S .arena-aws-lc -B .arena-aws-lc-build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build .arena-aws-lc-build --parallel 2
      - name: Build AWS-LC benchmark adapter
        run: |
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -O3 -Wall -Wextra -Werror -I"$GITHUB_WORKSPACE/.arena-aws-lc/include" arena/adapters/aws-lc/runner.c -L"$GITHUB_WORKSPACE/.arena-aws-lc-build/crypto" -Wl,-rpath,"$GITHUB_WORKSPACE/.arena-aws-lc-build/crypto" -lcrypto -lm -o arena-aws-lc-runner
      - name: Build NEXUS-Q benchmark runner with experimental native-kernel paths enabled
        run: cargo build --manifest-path arena/runners/nexusq/Cargo.toml --release --locked --features experimental-kernels
      - name: Run three alternating suites and retain raw samples
        env:
          NEXUSQ_ITERATIONS: "1000"
          NEXUSQ_WARMUPS: "100"
          NEXUSQ_SIGN_SAMPLES_PER_SEED: "16"
          AWSLC_ITERATIONS: "1000"
          AWSLC_WARMUPS: "100"
          NEXUSQ_OPT: release
          NEXUSQ_RUN_ID: ${{ github.sha }}
          ARENA_OPT: release
          AWSLC_VERSION: ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba
        run: |
          set -euo pipefail
          out=arena/results/ci/native-assembly
          export NEXUSQ_CPU="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          export ARENA_CPU="$NEXUSQ_CPU"
          export NEXUSQ_CPU_FEATURES="$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | xargs | tr ' ' ',')"
          export ARENA_CPU_FEATURES="$NEXUSQ_CPU_FEATURES"
          export NEXUSQ_RUSTC_VERBOSE="$(rustc -Vv | tr '\n' ';')"
          export RUSTC_VERSION="$(rustc --version)"
          export NEXUSQ_CARGO_LOCK_SHA256="$(sha256sum arena/runners/nexusq/Cargo.lock | cut -d' ' -f1)"
          export ARENA_CPU_FREQUENCY_KHZ="$(awk -F: '/cpu MHz/ {gsub(/ /,"",$2); printf "%d", $2*1000; exit}' /proc/cpuinfo)"
          export ARENA_CPU_GOVERNOR="unknown-hosted-runner"
          export NEXUSQ_CPU_FREQUENCY_KHZ="$ARENA_CPU_FREQUENCY_KHZ"
          export NEXUSQ_CPU_GOVERNOR="$ARENA_CPU_GOVERNOR"
          export ARENA_TARGET="x86_64-linux-gnu"
          export ARENA_OS="Ubuntu"
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then
              export NEXUSQ_RUN_ORDER="round-${round}-second"
              export ARENA_RUN_ORDER="round-${round}-first"
              ./arena-aws-lc-runner > "$out/aws-lc-round-${round}.jsonl"
              cargo run --manifest-path arena/runners/nexusq/Cargo.toml --release --locked --features experimental-kernels > "$out/nexusq-round-${round}.jsonl"
            else
              export NEXUSQ_RUN_ORDER="round-${round}-first"
              export ARENA_RUN_ORDER="round-${round}-second"
              cargo run --manifest-path arena/runners/nexusq/Cargo.toml --release --locked --features experimental-kernels > "$out/nexusq-round-${round}.jsonl"
              ./arena-aws-lc-runner > "$out/aws-lc-round-${round}.jsonl"
            fi
          done
      - name: Evaluate all nine operations against the 1.5x median and p95 gate
        run: |
          python3 arena/scripts/evaluate_native_assembly_gate.py arena/results/ci/native-assembly/gate-report.json arena/results/ci/native-assembly/nexusq-round-1.jsonl arena/results/ci/native-assembly/nexusq-round-2.jsonl arena/results/ci/native-assembly/nexusq-round-3.jsonl -- arena/results/ci/native-assembly/aws-lc-round-1.jsonl arena/results/ci/native-assembly/aws-lc-round-2.jsonl arena/results/ci/native-assembly/aws-lc-round-3.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-assembly-gate-${{ github.sha }}
          path: arena/results/ci/native-assembly/
          if-no-files-found: warn
          retention-days: 30
