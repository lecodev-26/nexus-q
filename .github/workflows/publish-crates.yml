name: Publish crates

# Publishes the NEXUS-Q workspace crates to crates.io in dependency order.
# Requires the CARGO_REGISTRY_TOKEN repository secret (crates.io API token
# with publish-new scope). For the first publication of each crate the token
# is mandatory; once the crates exist, trusted publishing (OIDC) can replace
# it (https://crates.io/docs/trusted-publishing).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          crates=(
            nexusq-kernels
            nexusq-ml-kem
            nexusq-ml-dsa
            nexusq-native-backend
            nexusq-core
            nexusq-c
            nexusq-py
            nexusq-cli
            nexusq-server
          )
          for c in "${crates[@]}"; do
            echo "=== Publishing $c ==="
            cargo publish -p "$c"
          done
