name: SDK CI

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  c-sdk:
    name: Build C SDK prerequisite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C SDK
        run: cargo build -p nexusq-c --release
      - name: Run C SDK tests
        run: cargo test -p nexusq-c

  typescript:
    name: TypeScript / Node.js bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build C SDK
        run: cargo build -p nexusq-c --release
      - name: Build TypeScript SDK
        run: |
          cd bindings/typescript
          npm ci
          npm run build
      - name: Smoke test
        run: |
          cd bindings/typescript
          NEXUSQ_LIBRARY=$GITHUB_WORKSPACE/target/release/libnexusq.so npm run smoke

  java:
    name: Java JNA bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Build C SDK
        run: cargo build -p nexusq-c --release
      - name: Build and test Java SDK
        env:
          NEXUSQ_LIBRARY: ${{ github.workspace }}/target/release/libnexusq.so
        run: mvn -f bindings/java package
      - name: Smoke test
        run: |
          JNA=$(find ~/.m2/repository/net/java/dev/jna -name 'jna-*.jar' | head -1)
          NEXUSQ_LIBRARY=$GITHUB_WORKSPACE/target/release/libnexusq.so \
            java -cp "bindings/java/target/classes:$JNA" \
            io.github.lecodev26.nexusq.examples.Smoke

  kotlin:
    name: Kotlin JNA bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler (pinned)
        run: |
          curl -sSL https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d "$HOME/.local"
          echo "$HOME/.local/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build C SDK
        run: cargo build -p nexusq-c --release
      - name: Compile and run Kotlin smoke test
        env:
          NEXUSQ_LIBRARY: ${{ github.workspace }}/target/release/libnexusq.so
        run: |
          curl -sSLo /tmp/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.16.0/jna-5.16.0.jar
          kotlinc bindings/kotlin/src bindings/kotlin/examples -cp /tmp/jna.jar -include-runtime -d /tmp/nexusq-kotlin.jar
          java -cp "/tmp/nexusq-kotlin.jar:/tmp/jna.jar" \
            io.github.lecodev26.nexusq.kotlin.examples.SmokeKt

  dotnet:
    name: C# / .NET P/Invoke bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - name: Build C SDK
        run: cargo build -p nexusq-c --release
      - name: Smoke test
        run: |
          NEXUSQ_LIBRARY=$GITHUB_WORKSPACE/target/release/libnexusq.so \
            dotnet run --project bindings/dotnet/examples/smoke
      - name: Pack NuGet package
        run: dotnet pack bindings/dotnet/src/Nexusq -c Release

  swift:
    name: Swift Package bindings
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C SDK
        run: cargo build -p nexusq-c --release
      - name: Build and test Swift package
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          swift build -Xlinker -L$GITHUB_WORKSPACE/target/release
          swift test -Xlinker -L$GITHUB_WORKSPACE/target/release
          swift run -Xlinker -L$GITHUB_WORKSPACE/target/release Smoke

  dart:
    name: Dart FFI bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build C SDK
        run: cargo build -p nexusq-c --release
      - name: Resolve dependencies
        run: cd bindings/dart && dart pub get
      - name: Analyze
        run: cd bindings/dart && dart analyze --fatal-infos
      - name: Unit tests
        env:
          NEXUSQ_LIBRARY: ${{ github.workspace }}/target/release/libnexusq.so
        run: cd bindings/dart && dart test
      - name: Smoke test
        env:
          NEXUSQ_LIBRARY: ${{ github.workspace }}/target/release/libnexusq.so
        run: cd bindings/dart && dart run example/smoke.dart
