name: PQC Benchmark Arena

on:
  workflow_dispatch:
  push:
    branches: ["ci/benchmark-arena", "nexusqv2"]
  pull_request:
    branches: ["nexusqv2"]

permissions:
  contents: read

jobs:
  validate-registry:
    name: Validate Arena registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate JSON registry and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("arena").rglob("*.json"):
              with path.open() as f:
                  json.load(f)
              print("valid:", path)
          required = [
              "arena/registry/algorithms.json",
              "arena/registry/implementations.json",
              "arena/registry/matrix.json",
              "arena/schemas/benchmark-result.schema.json",
          ]
          for path in required:
              assert Path(path).is_file(), path
          matrix = json.loads(Path("arena/registry/matrix.json").read_text())["pairs"]
          assert matrix
          allowed = {"IMPLEMENTED", "CI_READY", "PLANNED"}
          assert all(x["status"] in allowed for x in matrix)
          assert all(not (x["status"] == "IMPLEMENTED" and not x.get("adapter")) for x in matrix)
          implemented = [x for x in matrix if x["status"] == "IMPLEMENTED"]
          ci_ready = [x for x in matrix if x["status"] == "CI_READY"]
          assert {(x["implementation"], x["algorithm"]) for x in implemented} == {
              ("nexusq", "ml-kem-768"), ("nexusq", "ml-kem-1024"), ("nexusq", "ml-dsa-65")
          }
          assert {(x["implementation"], x["algorithm"]) for x in ci_ready} == {
              ("liboqs", "ml-kem-768"), ("liboqs", "ml-kem-1024"), ("liboqs", "ml-dsa-65"),
              ("circl", "ml-kem-768"), ("circl", "ml-dsa-65"),
              ("openssl", "ml-kem-768"), ("openssl", "ml-dsa-65"), ("openssl", "slh-dsa"),
              ("aws-lc", "ml-kem-768"), ("aws-lc", "ml-dsa-65"),
              ("botan", "ml-kem-768"), ("botan", "ml-dsa-65"),
              ("rustcrypto-kems", "ml-kem-768"), ("rustcrypto-kems", "hqc"),
              ("pq-code-package", "ml-kem-768"), ("pq-code-package", "ml-dsa-65")
          }
          implementations = {x["id"] for x in json.loads(Path("arena/registry/implementations.json").read_text())["implementations"]}
          assert implementations == {
              "nexusq", "liboqs", "circl", "openssl", "aws-lc", "boringssl",
              "botan", "rustcrypto-kems", "pq-code-package"
          }
          assert {x["implementation"] for x in matrix} == implementations
          assert len(matrix) == 23
          print("Arena registry/matrix/state/coverage contract: OK", len(matrix), "pairs")
          PY

  nexusq-reference:
    name: NEXUS-Q reference benchmark
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Arena reference runner
        run: cargo build --release --manifest-path arena/runners/nexusq/Cargo.toml
      - name: Run and validate NEXUS-Q adapter
        env:
          NEXUSQ_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p arena/results/ci
          ./arena/runners/nexusq/target/release/nexusq-arena-runner | tee arena/results/ci/nexusq-reference.jsonl
          python3 -c 'import json; from pathlib import Path; rows=[json.loads(x) for x in Path("arena/results/ci/nexusq-reference.jsonl").read_text().splitlines() if x.startswith("{")]; assert len(rows)==9; assert all(r["implementation"]["id"]=="nexusq" for r in rows); print("NEXUS-Q Arena records:",len(rows))'
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-nexusq-reference
          path: arena/results/ci/nexusq-reference.jsonl

# External implementations will be added only with pinned versions/commits,
# semantically equivalent adapters, and recorded build/CPU feature metadata.
# RISC-V and embedded remain dedicated-runner/hardware execution gates.

  liboqs-reference:
    name: liboqs 0.16.0 reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - name: Install liboqs build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc
      - name: Fetch pinned liboqs
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git .arena-liboqs
          test "$(git -C .arena-liboqs rev-parse --short=7 HEAD)" = "5a1a854"
      - name: Build liboqs
        run: |
          cmake -S .arena-liboqs -B .arena-liboqs/build -G Ninja -DOQS_BUILD_ONLY_LIB=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build .arena-liboqs/build --parallel 2
      - name: Compile Arena adapter
        env:
          LIBOQS_COMMIT: 5a1a854
        run: |
          gcc -O3 -std=c11 -DLIBOQS_COMMIT=\"$LIBOQS_COMMIT\" \
            -I.arena-liboqs/build/include -I.arena-liboqs/src \
            arena/adapters/liboqs/runner.c .arena-liboqs/build/lib/liboqs.a \
            -lcrypto -ldl -lpthread -lm -o arena-liboqs-runner
      - name: Run adapter and validate JSONL
        env:
          ARENA_OPT: release
          LIBOQS_COMMIT: 5a1a854
        run: |
          mkdir -p arena/results/ci
          ARENA_TARGET="$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]')" \
          ARENA_OS="$(uname -s)" \
          ARENA_CPU="$(awk -F': ' '/model name|Hardware|Processor/{print $2; exit}' /proc/cpuinfo || true)" \
          ARENA_CPU_FEATURES="$(python3 -c 'import json; s=set(); [s.update(x.split()) for x in open("/proc/cpuinfo", errors="ignore") if x.startswith(("flags", "Features")) and ":" in x for x in [x.split(":",1)[1]]]; print(",".join(json.dumps(x) for x in sorted(s)))')" \
          ./arena-liboqs-runner | tee arena/results/ci/liboqs-0.16.0.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows = [json.loads(x) for x in Path("arena/results/ci/liboqs-0.16.0.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows) == 9
          for row in rows:
              jsonschema.Draft202012Validator(schema).validate(row)
          assert all(r["implementation"]["id"] == "liboqs" for r in rows)
          print("liboqs Arena records/schema: OK", len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-liboqs-0.16.0
          path: arena/results/ci/liboqs-0.16.0.jsonl

  circl-reference:
    name: CIRCL 1.6.4 reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Fetch pinned CIRCL
        run: |
          git clone --depth 1 --branch v1.6.4 https://github.com/cloudflare/circl.git .arena-circl
          test "$(git -C .arena-circl rev-parse --short=7 HEAD)" = "901199c"
      - name: Build Arena adapter
        env:
          CIRCL_COMMIT: 901199c
          CIRCL_VERSION: 1.6.4
        run: |
          cp arena/adapters/circl/runner.go .arena-circl/arena_runner.go
          cp arena/adapters/circl/go.mod .arena-circl/arena_runner.mod
          cat > .arena-circl/arena_runner.mod <<'EOF'
          module nexusq-circl-arena

          go 1.25

          require github.com/cloudflare/circl v1.6.4
          EOF
          mkdir -p .arena-circl/arena-runner
          mv .arena-circl/arena_runner.go .arena-circl/arena-runner/main.go
          mv .arena-circl/arena_runner.mod .arena-circl/arena-runner/go.mod
          (cd .arena-circl/arena-runner && go mod edit -replace github.com/cloudflare/circl=..)
          (cd .arena-circl/arena-runner && go mod tidy)
          (cd .arena-circl/arena-runner && go build -trimpath -o runner .)
      - name: Run adapter and validate JSONL
        env:
          CIRCL_COMMIT: 901199c
          CIRCL_VERSION: 1.6.4
          ARENA_OPT: release
        run: |
          mkdir -p arena/results/ci
          ARENA_TARGET="$(go env GOARCH)-$(go env GOOS)" \
          ARENA_OS="$(uname -s)" \
          ARENA_CPU="$(awk -F': ' '/model name|Hardware|Processor/{print $2; exit}' /proc/cpuinfo || true)" \
          ARENA_CPU_FEATURES="" \
          .arena-circl/arena-runner/runner | tee arena/results/ci/circl-1.6.4.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY2'
          import json
          from pathlib import Path
          import jsonschema
          schema=json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows=[json.loads(x) for x in Path("arena/results/ci/circl-1.6.4.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==6
          for row in rows: jsonschema.Draft202012Validator(schema).validate(row)
          assert {r["implementation"]["id"] for r in rows}=={"circl"}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows} == {
              ("ml-kem","768","keygen"),("ml-kem","768","encaps"),("ml-kem","768","decaps"),
              ("ml-dsa","65","keygen"),("ml-dsa","65","sign"),("ml-dsa","65","verify")
          }
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-circl-1.6.4
          path: arena/results/ci/circl-1.6.4.jsonl

  openssl-reference:
    name: OpenSSL 3.5.9 reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential perl
      - name: Fetch pinned OpenSSL release
        run: |
          git clone --depth 1 --branch openssl-3.5.9 https://github.com/openssl/openssl.git .arena-openssl
          test "$(git -C .arena-openssl describe --tags --exact-match HEAD)" = "openssl-3.5.9"
      - name: Build OpenSSL
        run: |
          cd .arena-openssl
          ./Configure --prefix="$GITHUB_WORKSPACE/.arena-openssl-install" --openssldir="$GITHUB_WORKSPACE/.arena-openssl-install/ssl"
          make -j2
          make install_sw
      - name: Build Arena adapter
        run: |
          OPENSSL_LIBDIR="$(find "$GITHUB_WORKSPACE/.arena-openssl-install" -type f -name 'libcrypto.so*' -print -quit | xargs -r dirname)"
          test -n "$OPENSSL_LIBDIR"
          cc -std=c11 -O3 -Wall -Wextra -Werror \
            -I"$GITHUB_WORKSPACE/.arena-openssl-install/include" \
            arena/adapters/openssl/runner.c \
            -L"$OPENSSL_LIBDIR" -Wl,-rpath,"$OPENSSL_LIBDIR" -lcrypto -o arena-openssl-runner
      - name: Run adapter and validate JSONL
        env:
          ARENA_OPT: release
          ARENA_TARGET: x86_64-linux-gnu
          ARENA_OS: Ubuntu
          ARENA_CPU: github-actions
        run: |
          mkdir -p arena/results/ci
          ./arena-openssl-runner | tee arena/results/ci/openssl-3.5.9.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY2'
          import json
          from pathlib import Path
          import jsonschema
          schema=json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows=[json.loads(x) for x in Path("arena/results/ci/openssl-3.5.9.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==9
          for row in rows: jsonschema.Draft202012Validator(schema).validate(row)
          assert {r["implementation"]["id"] for r in rows}=={"openssl"}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows} == {
              ("ml-kem","768","keygen"),("ml-kem","768","encaps"),("ml-kem","768","decaps"),
              ("ml-dsa","65","keygen"),("ml-dsa","65","sign"),("ml-dsa","65","verify"),
              ("slh-dsa","SHAKE-128f","keygen"),("slh-dsa","SHAKE-128f","sign"),("slh-dsa","SHAKE-128f","verify")
          }
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-openssl-3.5.9
          path: arena/results/ci/openssl-3.5.9.jsonl

  aws-lc-reference:
    name: AWS-LC mainline reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned AWS-LC source
        run: |
          git init .arena-aws-lc
          git -C .arena-aws-lc remote add origin https://github.com/aws/aws-lc.git
          git -C .arena-aws-lc fetch --depth 1 origin ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba
          git -C .arena-aws-lc checkout --detach ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba
          test "$(git -C .arena-aws-lc rev-parse HEAD)" = "ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba"
      - name: Build AWS-LC
        run: |
          cmake -S .arena-aws-lc -B .arena-aws-lc-build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build .arena-aws-lc-build --parallel 2
      - name: Build Arena adapter
        run: |
          cc -std=c11 -O3 -Wall -Wextra -Werror \
            -I"$GITHUB_WORKSPACE/.arena-aws-lc/include" \
            arena/adapters/aws-lc/runner.c \
            -L"$GITHUB_WORKSPACE/.arena-aws-lc-build/crypto" \
            -Wl,-rpath,"$GITHUB_WORKSPACE/.arena-aws-lc-build/crypto" \
            -lcrypto -o arena-aws-lc-runner
      - name: Capture AWS-LC version and run adapter
        env:
          ARENA_OPT: release
          ARENA_TARGET: x86_64-linux-gnu
          ARENA_OS: Ubuntu
          ARENA_CPU: github-actions
        run: |
          mkdir -p arena/results/ci
          export AWSLC_VERSION="$(.arena-aws-lc-build/crypto/awslc_tool version 2>/dev/null | head -1 || true)"
          if [ -z "$AWSLC_VERSION" ]; then AWSLC_VERSION="runtime"; fi
          ./arena-aws-lc-runner | tee arena/results/ci/aws-lc-ec05f25.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY2'
          import json
          from pathlib import Path
          import jsonschema
          schema=json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows=[json.loads(x) for x in Path("arena/results/ci/aws-lc-ec05f25.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==6
          for row in rows: jsonschema.Draft202012Validator(schema).validate(row)
          assert {r["implementation"]["id"] for r in rows}=={"aws-lc"}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows} == {
              ("ml-kem","768","keygen"),("ml-kem","768","encaps"),("ml-kem","768","decaps"),
              ("ml-dsa","65","keygen"),("ml-dsa","65","sign"),("ml-dsa","65","verify")
          }
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-aws-lc-ec05f25
          path: arena/results/ci/aws-lc-ec05f25.jsonl

  botan-reference:
    name: Botan 3.13.0 reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Botan source
        run: |
          git clone --depth 1 --branch 3.13.0 https://github.com/randombit/botan.git .arena-botan
          git -C .arena-botan describe --tags --exact-match HEAD
          echo "BOTAN_COMMIT=$(git -C .arena-botan rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build Botan
        run: |
          cd .arena-botan
          ./configure.py --prefix="$GITHUB_WORKSPACE/.arena-botan-install" --without-documentation --disable-shared
          make -j2
          make install
      - name: Build Arena adapter
        env:
          CXXFLAGS: -std=c++20 -O3 -Wall -Wextra -Werror
        run: |
          c++ $CXXFLAGS arena/adapters/botan/runner.cpp \
            -I"$GITHUB_WORKSPACE/.arena-botan-install/include/botan-3" \
            -L"$GITHUB_WORKSPACE/.arena-botan-install/lib" \
            -Wl,-rpath,"$GITHUB_WORKSPACE/.arena-botan-install/lib" \
            -lbotan-3 -o arena-botan-runner
      - name: Run Botan adapter and validate schema
        env:
          BOTAN_VERSION: 3.13.0
          BOTAN_COMMIT: ${{ env.BOTAN_COMMIT }}
          ARENA_OPT: release
          ARENA_TARGET: x86_64-linux-gnu
          ARENA_OS: Ubuntu
          ARENA_CPU: github-actions
          ARENA_COMPILER: c++
        run: |
          mkdir -p arena/results/ci
          ARENA_COMPILER_VERSION="$(c++ --version | head -1)" ./arena-botan-runner | tee arena/results/ci/botan-3.13.0.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY2'
          import json
          from pathlib import Path
          import jsonschema
          schema=json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows=[json.loads(x) for x in Path("arena/results/ci/botan-3.13.0.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==6
          for row in rows: jsonschema.Draft202012Validator(schema).validate(row)
          assert {r["implementation"]["id"] for r in rows}=={"botan"}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows} == {
              ("ml-kem","768","keygen"),("ml-kem","768","encaps"),("ml-kem","768","decaps"),
              ("ml-dsa","65","keygen"),("ml-dsa","65","sign"),("ml-dsa","65","verify")
          }
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-botan-3.13.0
          path: arena/results/ci/botan-3.13.0.jsonl

  rustcrypto-kems-reference:
    name: RustCrypto KEMs reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned RustCrypto adapter
        working-directory: arena/adapters/rustcrypto-kems
        env:
          RUSTFLAGS: "-Dwarnings"
        run: |
          cargo build --release
      - name: Run RustCrypto adapter and validate schema
        working-directory: arena/adapters/rustcrypto-kems
        env:
          ARENA_TARGET: x86_64-linux-gnu
          ARENA_OS: Ubuntu
          ARENA_CPU: github-actions
          ARENA_OPT: release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/arena/results/ci"
          ARENA_COMPILER_VERSION="$(rustc --version)" ./target/release/nexusq-arena-rustcrypto-kems | tee "$GITHUB_WORKSPACE/arena/results/ci/rustcrypto-kems.jsonl"
          cd "$GITHUB_WORKSPACE"
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY2'
          import json
          from pathlib import Path
          import jsonschema
          schema=json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows=[json.loads(x) for x in Path("arena/results/ci/rustcrypto-kems.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==6
          for row in rows: jsonschema.Draft202012Validator(schema).validate(row)
          assert {r["implementation"]["id"] for r in rows}=={"rustcrypto-kems"}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows} == {
              ("ml-kem","768","keygen"),("ml-kem","768","encaps"),("ml-kem","768","decaps"),
              ("hqc","128","keygen"),("hqc","128","encaps"),("hqc","128","decaps")
          }
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-rustcrypto-kems
          path: arena/results/ci/rustcrypto-kems.jsonl

  pq-code-package-reference:
    name: PQ Code Package native reference adapters
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Fetch pinned PQ Code Package sources
        run: |
          git clone --depth 1 --branch v2.0.0 https://github.com/pq-code-package/mlkem-native.git .arena-mlkem-native
          test "$(git -C .arena-mlkem-native rev-parse HEAD)" = "d1b2fe782888bdb761a50336012923180be7f502"
          test "$(git -C .arena-mlkem-native describe --tags --exact-match HEAD)" = "v2.0.0"
          git clone --depth 1 --branch v1.0.0-beta2 https://github.com/pq-code-package/mldsa-native.git .arena-mldsa-native
          test "$(git -C .arena-mldsa-native rev-parse HEAD)" = "9b0ee84f4cf399043eca59eca4e5f8531ca1d61b"
          test "$(git -C .arena-mldsa-native describe --tags --exact-match HEAD)" = "v1.0.0-beta2"
      - name: Build pinned native libraries
        run: |
          make -C .arena-mlkem-native/examples/monolithic_build_native build
          make -C .arena-mldsa-native/examples/monolithic_build_native build
      - name: Compile Arena adapter
        run: |
          cc -std=c11 -O3 -Wall -Wextra -Werror \
            -I"$GITHUB_WORKSPACE/.arena-mlkem-native/examples/monolithic_build_native/mlkem_native" \
            -I"$GITHUB_WORKSPACE/.arena-mldsa-native/examples/monolithic_build_native/mldsa_native" \
            arena/adapters/pq-code-package/runner.c \
            "$GITHUB_WORKSPACE/.arena-mlkem-native/examples/monolithic_build_native/build/libmlkem768.a" \
            "$GITHUB_WORKSPACE/.arena-mldsa-native/examples/monolithic_build_native/build/libmldsa65.a" \
            -o arena-pq-code-package-runner
      - name: Run adapter and validate JSONL
        env:
          PQCP_VERSION: "mlkem-native-v2.0.0 + mldsa-native-v1.0.0-beta2"
          PQCP_COMMIT: "mlkem-native@d1b2fe782888bdb761a50336012923180be7f502;mldsa-native@9b0ee84f4cf399043eca59eca4e5f8531ca1d61b"
          ARENA_OPT: release
          ARENA_TARGET: x86_64-linux-gnu
          ARENA_OS: Ubuntu
          ARENA_CPU: github-actions
          ARENA_COMPILER: cc
        run: |
          mkdir -p arena/results/ci
          ARENA_COMPILER_VERSION="$(cc --version | head -1)" ./arena-pq-code-package-runner | tee arena/results/ci/pq-code-package.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY2'
          import json
          from pathlib import Path
          import jsonschema
          schema=json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows=[json.loads(x) for x in Path("arena/results/ci/pq-code-package.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==6
          for row in rows: jsonschema.Draft202012Validator(schema).validate(row)
          assert {r["implementation"]["id"] for r in rows}=={"pq-code-package"}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows} == {
              ("ml-kem","768","keygen"),("ml-kem","768","encaps"),("ml-kem","768","decaps"),
              ("ml-dsa","65","keygen"),("ml-dsa","65","sign"),("ml-dsa","65","verify")
          }
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-pq-code-package
          path: arena/results/ci/pq-code-package.jsonl

  compare-schema:
    name: Validate normalized adapter output
    runs-on: ubuntu-latest
    needs: [nexusq-reference, liboqs-reference, circl-reference, openssl-reference, aws-lc-reference, botan-reference, rustcrypto-kems-reference, pq-code-package-reference]
    steps:
      - uses: actions/checkout@v4
      - name: Download NEXUS-Q artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-nexusq-reference
          path: arena/results/ci/nexusq
      - name: Download liboqs artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-liboqs-0.16.0
          path: arena/results/ci/liboqs
      - name: Download CIRCL artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-circl-1.6.4
          path: arena/results/ci/circl
      - name: Download OpenSSL artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-openssl-3.5.9
          path: arena/results/ci/openssl
      - name: Download AWS-LC artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-aws-lc-ec05f25
          path: arena/results/ci/aws-lc
      - name: Download Botan artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-botan-3.13.0
          path: arena/results/ci/botan
      - name: Download RustCrypto artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-rustcrypto-kems
          path: arena/results/ci/rustcrypto-kems
      - name: Download PQ Code Package artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-pq-code-package
          path: arena/results/ci/pq-code-package
      - name: Validate normalized JSONL against schema
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          files = list(Path("arena/results/ci").rglob("*.jsonl"))
          assert files
          rows = [json.loads(x) for p in files for x in p.read_text().splitlines() if x.startswith("{")]
          assert len(rows) == 57, len(rows)
          for row in rows:
              jsonschema.Draft202012Validator(schema).validate(row)
          matrix = {(r["algorithm"]["id"], r["algorithm"]["parameter_set"], r["operation"]) for r in rows}
          expected = {
              ("ml-kem", "768", "keygen"), ("ml-kem", "768", "encaps"), ("ml-kem", "768", "decaps"),
              ("ml-kem", "1024", "keygen"), ("ml-kem", "1024", "encaps"), ("ml-kem", "1024", "decaps"),
              ("ml-dsa", "65", "keygen"), ("ml-dsa", "65", "sign"), ("ml-dsa", "65", "verify"),
              ("hqc", "128", "keygen"), ("hqc", "128", "encaps"), ("hqc", "128", "decaps"),
              ("slh-dsa", "SHAKE-128f", "keygen"), ("slh-dsa", "SHAKE-128f", "sign"), ("slh-dsa", "SHAKE-128f", "verify"),
          }
          assert matrix == expected, matrix
          assert {r["implementation"]["id"] for r in rows} == {"nexusq", "liboqs", "circl", "openssl", "aws-lc", "botan", "rustcrypto-kems", "pq-code-package"}
          print("normalized Arena schema/matrix: OK", len(rows))
          PY


  v2-performance-gate:
    name: V2-10 performance gate
    runs-on: ubuntu-latest
    needs: compare-schema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pqc-arena-nexusq-reference
          path: arena/results/ci/nexusq
      - uses: actions/download-artifact@v4
        with:
          pattern: pqc-arena-*
          path: arena/results/ci/comparators
          merge-multiple: true
      - name: Evaluate V2-10 gate
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          baseline={("ml-kem","768","keygen"):33940.0,("ml-kem","768","encaps"):27970.0,("ml-kem","768","decaps"):34620.0,("ml-kem","1024","keygen"):53890.0,("ml-kem","1024","encaps"):46050.0,("ml-kem","1024","decaps"):52140.0,("ml-dsa","65","keygen"):168690.0,("ml-dsa","65","sign"):600730.0,("ml-dsa","65","verify"):101200.0}
          expected=set(baseline)
          rows=[json.loads(x) for x in Path("arena/results/ci/nexusq/nexusq-reference.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==9
          best={}
          for p in Path("arena/results/ci/comparators").rglob("*.jsonl"):
            for line in p.read_text().splitlines():
              if not line.startswith("{"): continue
              r=json.loads(line); k=(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"])
              if k in expected and r["implementation"]["id"]!="nexusq":
                lat=float(r["measurement"]["latency_ns"])
                if k not in best or lat<best[k]["latency_ns"]: best[k]={"implementation":r["implementation"]["id"],"latency_ns":lat}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows}==expected
          assert set(best)==expected
          results=[]; ratios=[]; improved=0; no_regression=True
          for r in rows:
            k=(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]); lat=float(r["measurement"]["latency_ns"]); vr=lat/baseline[k]; ratios.append(vr)
            if vr<.95: improved+=1
            if vr>1.05: no_regression=False
            results.append({"algorithm":k[0],"parameter_set":k[1],"operation":k[2],"v2_latency_ns":lat,"v1_latency_ns":baseline[k],"v2_vs_v1":vr,"best_comparator":best[k]["implementation"],"best_comparator_ns":best[k]["latency_ns"],"v2_vs_best":lat/best[k]["latency_ns"]})
          geomean=math.exp(sum(math.log(x) for x in ratios)/len(ratios))
          report={"schema":"nexusq-v2-performance-gate-v1","commit":"${{ github.sha }}","criteria":{"max_geomean_vs_v1":.95,"max_individual_regression_vs_v1":1.05,"minimum_operations_improved_by_5_percent":5},"geomean_vs_v1":geomean,"operations_improved_by_5_percent":improved,"no_individual_regression_over_5_percent":no_regression,"results":results}
          Path("arena/results/ci/v2-performance-gate.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          assert geomean<=.95, f"V2 geomean gate failed: {geomean:.4f}"
          assert no_regression, "V2 individual regression gate failed"
          assert improved>=5, f"Only {improved}/9 operations improved by >=5%"
          print("V2-10 performance gate: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-10-performance-gate-${{ github.sha }}
          path: arena/results/ci/v2-performance-gate.json
