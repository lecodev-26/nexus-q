name: PQC Benchmark Arena

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-registry:
    name: Validate Arena registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate JSON registry and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("arena").rglob("*.json"):
              with path.open() as f:
                  json.load(f)
              print("valid:", path)
          required = [
              "arena/registry/algorithms.json",
              "arena/registry/implementations.json",
              "arena/registry/matrix.json",
              "arena/schemas/benchmark-result.schema.json",
          ]
          for path in required:
              assert Path(path).is_file(), path
          matrix = json.loads(Path("arena/registry/matrix.json").read_text())["pairs"]
          assert matrix
          allowed = {"IMPLEMENTED", "CI_READY", "PLANNED"}
          assert all(x["status"] in allowed for x in matrix)
          assert all(not (x["status"] == "IMPLEMENTED" and not x.get("adapter")) for x in matrix)
          implemented = [x for x in matrix if x["status"] == "IMPLEMENTED"]
          ci_ready = [x for x in matrix if x["status"] == "CI_READY"]
          assert {(x["implementation"], x["algorithm"]) for x in implemented} == {
              ("nexusq", "ml-kem-768"), ("nexusq", "ml-kem-1024"), ("nexusq", "ml-dsa-65")
          }
          assert {(x["implementation"], x["algorithm"]) for x in ci_ready} == {
              ("liboqs", "ml-kem-768"), ("liboqs", "ml-kem-1024"), ("liboqs", "ml-dsa-65"),
              ("circl", "ml-kem-768"), ("circl", "ml-dsa-65")
          }
          implementations = {x["id"] for x in json.loads(Path("arena/registry/implementations.json").read_text())["implementations"]}
          assert implementations == {
              "nexusq", "liboqs", "circl", "openssl", "aws-lc", "boringssl",
              "botan", "rustcrypto-kems", "pq-code-package"
          }
          assert {x["implementation"] for x in matrix} == implementations
          assert len(matrix) == 23
          print("Arena registry/matrix/state/coverage contract: OK", len(matrix), "pairs")
          PY

  nexusq-reference:
    name: NEXUS-Q reference benchmark
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Arena reference runner
        run: cargo build --release --manifest-path arena/runners/nexusq/Cargo.toml
      - name: Run and validate NEXUS-Q adapter
        env:
          NEXUSQ_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p arena/results/ci
          ./arena/runners/nexusq/target/release/nexusq-arena-runner | tee arena/results/ci/nexusq-reference.jsonl
          python3 -c 'import json; from pathlib import Path; rows=[json.loads(x) for x in Path("arena/results/ci/nexusq-reference.jsonl").read_text().splitlines() if x.startswith("{")]; assert len(rows)==9; assert all(r["implementation"]["id"]=="nexusq" for r in rows); print("NEXUS-Q Arena records:",len(rows))'
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-nexusq-reference
          path: arena/results/ci/nexusq-reference.jsonl

# External implementations will be added only with pinned versions/commits,
# semantically equivalent adapters, and recorded build/CPU feature metadata.
# RISC-V and embedded remain dedicated-runner/hardware execution gates.

  liboqs-reference:
    name: liboqs 0.16.0 reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - name: Install liboqs build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc
      - name: Fetch pinned liboqs
        run: |
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git .arena-liboqs
          test "$(git -C .arena-liboqs rev-parse --short=7 HEAD)" = "5a1a854"
      - name: Build liboqs
        run: cmake -S .arena-liboqs -B .arena-liboqs/build -G Ninja -DOQS_BUILD_ONLY_LIB=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile Arena adapter
        env:
          LIBOQS_COMMIT: 5a1a854
        run: |
          gcc -O3 -std=c11 -DLIBOQS_COMMIT="\\\"$LIBOQS_COMMIT\\\"" \
            -I.arena-liboqs/build/include -I.arena-liboqs/src \
            arena/adapters/liboqs/runner.c .arena-liboqs/build/lib/liboqs.a \
            -lcrypto -ldl -lpthread -lm -o arena-liboqs-runner
      - name: Run adapter and validate JSONL
        env:
          ARENA_OPT: release
          LIBOQS_COMMIT: 5a1a854
        run: |
          mkdir -p arena/results/ci
          ARENA_TARGET="$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]')" \
          ARENA_OS="$(uname -s)" \
          ARENA_CPU="$(awk -F': ' '/model name|Hardware|Processor/{print $2; exit}' /proc/cpuinfo || true)" \
          ARENA_CPU_FEATURES="$(python3 -c 'import json; s=set(); [s.update(x.split()) for x in open("/proc/cpuinfo", errors="ignore") if x.startswith(("flags", "Features")) and ":" in x for x in [x.split(":",1)[1]]]; print(",".join(json.dumps(x) for x in sorted(s)))')" \
          ./arena-liboqs-runner | tee arena/results/ci/liboqs-0.16.0.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows = [json.loads(x) for x in Path("arena/results/ci/liboqs-0.16.0.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows) == 9
          for row in rows:
              jsonschema.Draft202012Validator(schema).validate(row)
          assert all(r["implementation"]["id"] == "liboqs" for r in rows)
          print("liboqs Arena records/schema: OK", len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-liboqs-0.16.0
          path: arena/results/ci/liboqs-0.16.0.jsonl

  circl-reference:
    name: CIRCL 1.6.4 reference adapter
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Fetch pinned CIRCL
        run: |
          git clone --depth 1 --branch v1.6.4 https://github.com/cloudflare/circl.git .arena-circl
          test "$(git -C .arena-circl rev-parse --short=7 HEAD)" = "901199c"
      - name: Build Arena adapter
        env:
          CIRCL_COMMIT: 901199c
          CIRCL_VERSION: 1.6.4
        run: |
          cp arena/adapters/circl/runner.go .arena-circl/arena_runner.go
          cp arena/adapters/circl/go.mod .arena-circl/arena_runner.mod
          cat > .arena-circl/arena_runner.mod <<'EOF'
          module nexusq-circl-arena

          go 1.25

          require github.com/cloudflare/circl v1.6.4
          EOF
          mkdir -p .arena-circl/arena-runner
          mv .arena-circl/arena_runner.go .arena-circl/arena-runner/main.go
          mv .arena-circl/arena_runner.mod .arena-circl/arena-runner/go.mod
          (cd .arena-circl/arena-runner && go mod edit -replace github.com/cloudflare/circl=..)
          (cd .arena-circl/arena-runner && go build -trimpath -o runner .)
      - name: Run adapter and validate JSONL
        env:
          CIRCL_COMMIT: 901199c
          CIRCL_VERSION: 1.6.4
          ARENA_OPT: release
        run: |
          mkdir -p arena/results/ci
          ARENA_TARGET="$(go env GOARCH)-$(go env GOOS)" \
          ARENA_OS="$(uname -s)" \
          ARENA_CPU="$(awk -F': ' '/model name|Hardware|Processor/{print $2; exit}' /proc/cpuinfo || true)" \
          ARENA_CPU_FEATURES="" \
          .arena-circl/arena-runner/runner | tee arena/results/ci/circl-1.6.4.jsonl
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY2'
          import json
          from pathlib import Path
          import jsonschema
          schema=json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          rows=[json.loads(x) for x in Path("arena/results/ci/circl-1.6.4.jsonl").read_text().splitlines() if x.startswith("{")]
          assert len(rows)==6
          for row in rows: jsonschema.Draft202012Validator(schema).validate(row)
          assert {r["implementation"]["id"] for r in rows}=={"circl"}
          assert {(r["algorithm"]["id"],r["algorithm"]["parameter_set"],r["operation"]) for r in rows} == {
              ("ml-kem","768","keygen"),("ml-kem","768","encaps"),("ml-kem","768","decaps"),
              ("ml-dsa","65","keygen"),("ml-dsa","65","sign"),("ml-dsa","65","verify")
          }
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-arena-circl-1.6.4
          path: arena/results/ci/circl-1.6.4.jsonl

  compare-schema:
    name: Validate normalized adapter output
    runs-on: ubuntu-latest
    needs: [nexusq-reference, liboqs-reference, circl-reference]
    steps:
      - uses: actions/checkout@v4
      - name: Download NEXUS-Q artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-nexusq-reference
          path: arena/results/ci/nexusq
      - name: Download liboqs artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-liboqs-0.16.0
          path: arena/results/ci/liboqs
      - name: Download CIRCL artifact
        uses: actions/download-artifact@v4
        with:
          name: pqc-arena-circl-1.6.4
          path: arena/results/ci/circl
      - name: Validate normalized JSONL against schema
        run: |
          python3 -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path("arena/schemas/benchmark-result.schema.json").read_text())
          files = list(Path("arena/results/ci").rglob("*.jsonl"))
          assert files
          rows = [json.loads(x) for p in files for x in p.read_text().splitlines() if x.startswith("{")]
          assert len(rows) == 24, len(rows)
          for row in rows:
              jsonschema.Draft202012Validator(schema).validate(row)
          matrix = {(r["algorithm"]["id"], r["algorithm"]["parameter_set"], r["operation"]) for r in rows}
          expected = {
              ("ml-kem", "768", "keygen"), ("ml-kem", "768", "encaps"), ("ml-kem", "768", "decaps"),
              ("ml-kem", "1024", "keygen"), ("ml-kem", "1024", "encaps"), ("ml-kem", "1024", "decaps"),
              ("ml-dsa", "65", "keygen"), ("ml-dsa", "65", "sign"), ("ml-dsa", "65", "verify"),
          }
          assert matrix == expected, matrix
          assert {r["implementation"]["id"] for r in rows} == {"nexusq", "liboqs", "circl"}
          print("normalized Arena schema/matrix: OK", len(rows))
          PY
