name: NEXUS-Q Sequential CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusq-sequential-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-security-core:
    name: 'Phase 1 — Core, security, secrets and fuzz build'
    uses: ./.github/workflows/security-ci.yml
    permissions:
      contents: read

  phase-2-sdks:
    name: 'Phase 2 — SDKs and language bindings'
    needs: phase-1-security-core
    uses: ./.github/workflows/sdk-ci.yml
    permissions:
      contents: read

  phase-3-correctness:
    if: github.event_name != 'pull_request'
    name: 'Phase 3 — Interoperability and upstream vectors'
    needs: phase-2-sdks
    uses: ./.github/workflows/correctness-interoperability.yml
    permissions:
      contents: read

  phase-4-native-specialized:
    if: github.event_name != 'pull_request'
    name: 'Phase 4 — Native assembly and kernel-specific checks'
    needs: phase-3-correctness
    uses: ./.github/workflows/native-assembly-ci.yml
    permissions:
      contents: read

  phase-5-native-backend:
    if: github.event_name != 'pull_request'
    name: 'Phase 5 — Experimental native backend gate'
    needs: phase-4-native-specialized
    uses: ./.github/workflows/native-backend-gate.yml
    permissions:
      contents: read

  phase-6-pqc-arena:
    if: github.event_name != 'pull_request'
    name: 'Phase 6 — PQC Benchmark Arena'
    needs: phase-5-native-backend
    uses: ./.github/workflows/pqc-arena.yml
    permissions:
      contents: read

  phase-7-benchmarks:
    if: github.event_name != 'pull_request'
    name: 'Phase 7 — Cross-platform benchmarks'
    needs: phase-6-pqc-arena
    uses: ./.github/workflows/benchmarks.yml
    permissions:
      contents: read

  phase-8-hybrid-benchmark:
    if: github.event_name != 'pull_request'
    name: 'Phase 8 — Hybrid benchmark gate'
    needs: phase-7-benchmarks
    uses: ./.github/workflows/hybrid-benchmark.yml
    permissions:
      contents: read

  phase-10-aa-control:
    if: github.event_name != 'pull_request'
    name: 'Phase 10 — A/A benchmark noise control'
    needs: phase-8-hybrid-benchmark
    uses: ./.github/workflows/native-backend-aa-control.yml
    permissions:
      contents: read

  phase-11-final-fuzz-soak:
    if: github.event_name != 'pull_request'
    name: 'Phase 11 — Final sequential four-hour fuzz campaigns'
    needs: phase-10-aa-control
    uses: ./.github/workflows/fuzz-soak.yml
    permissions:
      contents: read
