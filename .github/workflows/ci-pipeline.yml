name: NEXUS-Q Sequential CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusq-sequential-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV (Rust 1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check all workspace targets at declared MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Check isolated native backend workspace at declared MSRV
        run: cargo check --manifest-path crates/nexusq-native-backend/Cargo.toml --workspace --all-targets --locked

  detect-changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths (fail closed to full CI)
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [[ "$EVENT_NAME" == push ]]; then
            base="$PUSH_BASE"; head="$PUSH_HEAD"
          else
            exit 0
          fi
          # First push / missing refs / diff errors always run the full pipeline.
          [[ -n "$base" && -n "$head" && "$base" != 0000000000000000000000000000000000000000 ]] || exit 0
          files=$(git diff --name-only "$base" "$head") || exit 0
          [[ -n "$files" ]] || exit 0
          docs_only=true
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            if [[ "$file" == docs/* ]]; then
              continue
            fi
            # Root-level documentation only; Markdown files under source/config
            # directories must not accidentally bypass CI.
            if [[ "$file" != */* && ( "$file" == *.md || "$file" == LICENSE || "$file" == LICENSE.* || "$file" == CHANGELOG* || "$file" == CONTRIBUTING* || "$file" == CODE_OF_CONDUCT* || "$file" == SECURITY.md ) ]]; then
              continue
            fi
            docs_only=false
            break
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  phase-1-security-core:
    needs: detect-changes
    name: 'Phase 1 — Core, security, secrets and fuzz build'
    uses: ./.github/workflows/security-ci.yml
    permissions:
      contents: read

  phase-2-sdks:
    name: 'Phase 2 — SDKs and language bindings'
    needs: phase-1-security-core
    uses: ./.github/workflows/sdk-ci.yml
    permissions:
      contents: read

  phase-3-correctness:
    name: 'Phase 3 — Interoperability and upstream vectors'
    needs: phase-2-sdks
    uses: ./.github/workflows/correctness-interoperability.yml
    permissions:
      contents: read

  phase-4-native-specialized:
    name: 'Phase 4 — Native assembly and kernel-specific checks'
    needs: phase-3-correctness
    uses: ./.github/workflows/native-assembly-ci.yml
    permissions:
      contents: read

  phase-5-native-backend:
    name: 'Phase 5 — Experimental native backend gate'
    needs: phase-4-native-specialized
    uses: ./.github/workflows/native-backend-gate.yml
    permissions:
      contents: read

  phase-6-pqc-arena:
    name: 'Phase 6 — PQC Benchmark Arena'
    needs: phase-5-native-backend
    uses: ./.github/workflows/pqc-arena.yml
    permissions:
      contents: read

  phase-7-benchmarks:
    name: 'Phase 7 — Cross-platform benchmarks'
    needs: phase-6-pqc-arena
    uses: ./.github/workflows/benchmarks.yml
    permissions:
      contents: read

  phase-8-hybrid-benchmark:
    name: 'Phase 8 — Hybrid benchmark gate'
    needs: phase-7-benchmarks
    uses: ./.github/workflows/hybrid-benchmark.yml
    permissions:
      contents: read

  phase-10-aa-control:
    name: 'Phase 10 — A/A benchmark noise control'
    needs: phase-8-hybrid-benchmark
    uses: ./.github/workflows/native-backend-aa-control.yml
    permissions:
      contents: read

  phase-11-final-fuzz-soak:
    name: 'Phase 11 — Final sequential four-hour fuzz campaigns'
    needs: phase-10-aa-control
    uses: ./.github/workflows/fuzz-soak.yml
    permissions:
      contents: read
