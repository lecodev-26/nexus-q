name: NEXUS-Q Native Backend Diagnostics (informational)

# Diagnostic only. Never a gate input, never changes a verdict.
# Links AWS-LC (pinned) and the NEXUS-Q native backend C/asm objects into one
# process and alternates calls on every iteration (diag/inproc_ab.c), then
# profiles selected operations with perf to attribute any per-CPU gap
# (e.g. AMD EPYC 7763 / Zen 3) to concrete functions.

on:
  workflow_dispatch:
  push:
    branches: ["perf/native-backend-hybrid"]
    paths:
      - "crates/nexusq-native-backend/diag/**"
      - ".github/workflows/native-backend-diag.yml"

permissions:
  contents: read

concurrency:
  group: native-backend-diag-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWSLC_COMMIT: ec05f25ef5bcb1bf03d2e2f44ba57973a878e0ba

jobs:
  inproc-ab:
    name: In-process A/B + perf (sample ${{ matrix.sample }})
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common || sudo apt-get install -y linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          sudo sysctl -w kernel.kptr_restrict=0 || true
      - name: Host
        run: |
          lscpu | sed -n 's/^Model name:[[:space:]]*//p'
          grep -m1 microcode /proc/cpuinfo || true
          cc --version | head -1
          nproc
      - name: Build pinned AWS-LC (same commands as the gate)
        run: |
          git init .arena-aws-lc
          git -C .arena-aws-lc remote add origin https://github.com/aws/aws-lc.git
          git -C .arena-aws-lc fetch --depth 1 origin "$AWSLC_COMMIT"
          git -C .arena-aws-lc checkout --detach "$AWSLC_COMMIT"
          cmake -S .arena-aws-lc -B .arena-aws-lc-build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build .arena-aws-lc-build --parallel 2 --target crypto
      - name: Build diagnostic binaries (build.rs flags; upstream x4 Keccak; AWS-LC flags)
        run: |
          d=crates/nexusq-native-backend/diag
          $d/run.sh "$PWD/.arena-aws-lc" "$PWD/.arena-aws-lc-build" /tmp/ab
          $d/run.sh "$PWD/.arena-aws-lc" "$PWD/.arena-aws-lc-build" /tmp/ab-upx4 -DNQ_UPSTREAM_X4_KECCAK
          $d/run.sh "$PWD/.arena-aws-lc" "$PWD/.arena-aws-lc-build" /tmp/ab-awsflags -std=gnu11 -DNDEBUG -fvisibility=hidden -fno-common -fno-omit-frame-pointer
      - name: In-process A/B, 3 passes x 10000 iterations (pinned to CPU 1)
        run: |
          for pass in 1 2 3; do
            for bin in /tmp/ab /tmp/ab-upx4 /tmp/ab-awsflags; do
              echo "== $bin pass $pass ($(lscpu | sed -n 's/^Model name:[[:space:]]*//p'))"
              taskset -c 1 $bin/inproc_ab 10000 | python3 -c "import sys;[print('  '.join(f'{c:>22}' if i==0 else f'{c:>10}' for i,c in enumerate(l.split('\t')))) for l in sys.stdin.read().splitlines()]"
            done
          done
      - name: perf profiles (cpu-clock sampling; informational)
        continue-on-error: true
        run: |
          PERF="$(command -v perf || ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1)"
          test -n "$PERF" || { echo "perf not available on this image"; exit 0; }
          for op in kem768-decaps kem768-keygen-derand kem1024-encaps-derand; do
            for impl in aws nq; do
              echo "================ $op  impl=$impl"
              NQ_AB_IMPL=$impl sudo -E "$PERF" record -q -e cpu-clock -F 20000 -o /tmp/perf-$op-$impl.data -- taskset -c 1 /tmp/ab/inproc_ab 20000 $op >/dev/null 2>&1 || true
              sudo "$PERF" report -i /tmp/perf-$op-$impl.data --no-children --sort sym --stdio --percent-limit 0.7 2>/dev/null | grep -v '^#' | grep -v '^$' | head -30 || true
            done
          done
