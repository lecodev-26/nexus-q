name: Publish Python

# Builds and publishes the nexusq PyPI package (native extension built from
# crates/nexusq-py with maturin) using PyPI Trusted Publishing (OIDC).
# The pending publisher must be registered on pypi.org for this repository
# and this exact workflow filename before the first run.
# Wheels are built on a matrix and uploaded as artifacts; a single Linux job
# downloads them and publishes (pypa/gh-action-pypi-publish requires Linux).
# Note: abi3-py314 builds require CPython 3.14; the wheels support Python >= 3.14.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: crates/nexusq-py
        run: maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/nexusq-py/dist/
          if-no-files-found: error

  wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        working-directory: crates/nexusq-py
        run: maturin build --release --out dist

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/nexusq-py/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
