name: Publish Python

# Builds and publishes the nexusq PyPI package (native extension built from
# crates/nexusq-py with maturin) using PyPI Trusted Publishing (OIDC).
# The pending publisher must be registered on pypi.org for this repository
# and this exact workflow filename before the first run.
# This minimal job publishes the sdist and the linux x86_64 wheel; the
# additional platform wheels can be added to the same version afterwards.
# Note: abi3-py314 builds require CPython 3.14; the wheels support Python >= 3.14.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build and publish (linux x86_64 + sdist)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Install Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist and wheel
        working-directory: crates/nexusq-py
        run: |
          maturin sdist --out dist
          maturin build --release --out dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: crates/nexusq-py/dist
          skip-existing: true
