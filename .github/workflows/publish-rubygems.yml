name: Publish RubyGems

# Builds and pushes the nexusq gem to RubyGems.org using Trusted Publishing
# (OIDC). The pending trusted publisher must be registered on rubygems.org for
# gem nexusq, owner lecodev-26, repository nexus-q, and this exact workflow
# filename before the first run.

on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build gem
        working-directory: bindings/ruby
        run: gem build nexusq.gemspec

      - name: Move gem to workspace root
        run: mv bindings/ruby/*.gem .

      - name: Push to RubyGems.org
        uses: rubygems/release-gem@v1
