name: NEXUS-Q V4 — PR CI

# All Rust validation runs on GitHub-hosted runners. Do not build, lint, or test locally.
# The evidence archive is written only after every validation gate succeeds.
on:
  push:
    branches:
      - v4/issue-23-kernel-work
    paths-ignore:
      - 'artifact-archive/**'
  pull_request:
    branches:
      - nexusqv4
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: v4-pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-validation:
    name: Rust / fmt, check, clippy, test, build, docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust with CI components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Record toolchain and tested revision
        run: |
          rustc -Vv
          cargo -V
          git rev-parse HEAD

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace and all targets
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy on workspace and all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build workspace and all targets
        run: cargo build --workspace --all-targets --locked

      - name: Build public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  security:
    uses: ./.github/workflows/security-ci.yml
    permissions:
      contents: read

  phase0:
    uses: ./.github/workflows/v4-issue23-phase0.yml
    permissions:
      actions: read
      contents: read

  measurement:
    uses: ./.github/workflows/v4-issue23-measurement.yml
    permissions:
      actions: read
      contents: read

  archive:
    name: Archive evidence (only after every gate passed)
    needs: [rust-validation, security, phase0, measurement]
    if: github.ref == 'refs/heads/v4/issue-23-kernel-work'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download Phase 0 and measurement evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v4-issue23-*-${{ github.sha }}
          path: evidence

      - name: Archive evidence and publish the PR CI status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Branch moved to $latest_sha; the newer CI run will archive and publish."
            exit 0
          fi
          for entry in phase0:v4-issue23-phase0 measurement:v4-issue23-measurement; do
            key="${entry%%:*}"
            artifact="${entry#*:}"
            source_dir="evidence/${artifact}-${GITHUB_SHA}"
            destination="artifact-archive/v4-issue23-${key}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            [[ -d "$source_dir" ]] || { echo "Missing evidence: $source_dir" >&2; exit 1; }
            mkdir -p "$destination"
            cp -a "$source_dir/." "$destination/"
            cat > "$destination/README.txt" <<EOF
          NEXUS-Q V4 ${key} CI archive
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          source_commit=${GITHUB_SHA}
          source_ref=${GITHUB_REF}
          workflow_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
            find "$destination" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > "$destination/SHA256SUMS.txt"
            git add "$destination"
          done
          new_sha="$GITHUB_SHA"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(artifacts): archive V4 CI run ${GITHUB_RUN_ID} [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin "$HEAD_REF"
              git rebase FETCH_HEAD
              if git push origin "HEAD:refs/heads/${HEAD_REF}"; then
                new_sha="$(git rev-parse HEAD)"
                break
              fi
              sleep 1
            done
            [[ "$new_sha" != "$GITHUB_SHA" ]] || { echo 'Unable to push archived evidence after retries' >&2; exit 1; }
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$new_sha" \
            -f state=success -f context='NEXUS-Q V4 / PR CI' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="All gates passed on ${GITHUB_SHA:0:7}; head differs only by archived evidence." >/dev/null
          echo "Published NEXUS-Q V4 / PR CI=success on $new_sha"
