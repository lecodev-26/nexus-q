name: Native C ABI runtime artifacts

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths (fail closed to full CI)
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [[ "$EVENT_NAME" == push ]]; then
            base="$PUSH_BASE"; head="$PUSH_HEAD"
          else
            exit 0
          fi
          # First push / missing refs / diff errors always run the full pipeline.
          [[ -n "$base" && -n "$head" && "$base" != 0000000000000000000000000000000000000000 ]] || exit 0
          files=$(git diff --name-only "$base" "$head") || exit 0
          [[ -n "$files" ]] || exit 0
          docs_only=true
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            if [[ "$file" == docs/* ]]; then
              continue
            fi
            # Root-level documentation only; Markdown files under source/config
            # directories must not accidentally bypass CI.
            if [[ "$file" != */* && ( "$file" == *.md || "$file" == LICENSE || "$file" == LICENSE.* || "$file" == CHANGELOG* || "$file" == CONTRIBUTING* || "$file" == CODE_OF_CONDUCT* || "$file" == SECURITY.md ) ]]; then
              continue
            fi
            docs_only=false
            break
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  build-runtime:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    name: Build ${{ matrix.target }} runtime
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: native-backend
            library: libnexusq.so
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: native-backend-portable
            library: libnexusq.so
          - runner: macos-14
            target: aarch64-apple-darwin
            features: native-backend-portable
            library: libnexusq.dylib
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            features: native-backend-portable
            library: nexusq.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and test C ABI runtime
        run: |
          cargo test -p nexusq-c --locked --features ${{ matrix.features }}
          cargo build -p nexusq-c --locked --release --features ${{ matrix.features }}
        shell: bash
      - name: Smoke test the built shared library through its C ABI
        shell: bash
        run: |
          python - <<'PY'
          import ctypes
          from pathlib import Path
          library = Path("target/release/${{ matrix.library }}")
          runtime = ctypes.CDLL(str(library.resolve()))
          runtime.nexusq_backend_name.restype = ctypes.c_char_p
          runtime.nexusq_backend_is_experimental.restype = ctypes.c_uint8
          name = runtime.nexusq_backend_name().decode("ascii")
          experimental = runtime.nexusq_backend_is_experimental()
          assert name == "native-experimental", name
          assert experimental == 1, experimental
          print({"pqc_backend": name, "experimental": experimental, "library": str(library)})
          PY
      - name: Assemble versioned runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-runtime/lib native-runtime/include
          cp "target/release/${{ matrix.library }}" native-runtime/lib/
          cp crates/nexusq-c/include/nexusq.h native-runtime/include/
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          cargo = Path("Cargo.toml").read_text()
          version = re.search(r'(?m)^version = "([^"]+)"', cargo).group(1)
          manifest = {
              "schema": "nexusq-native-runtime-v1",
              "version": version,
              "target": "${{ matrix.target }}",
              "library": "lib/${{ matrix.library }}",
              "header": "include/nexusq.h",
              "provider": "native-experimental",
              "default_provider": "rustcrypto",
              "experimental": True,
              "feature": "${{ matrix.features }}",
              "automatic_runtime_download": False,
              "note": "Build artifact for SDK packaging; not an independently audited production release."
          }
          Path("native-runtime/runtime.json").write_text(json.dumps(manifest, indent=2) + "\n")
          files = sorted([*Path("native-runtime/lib").glob("*"), *Path("native-runtime/include").glob("*"), Path("native-runtime/runtime.json")])
          lines = []
          for file in files:
              digest = hashlib.sha256(file.read_bytes()).hexdigest()
              lines.append(f"{digest}  {file.relative_to('native-runtime')}")
          Path("native-runtime/SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nexusq-native-runtime-${{ matrix.target }}
          path: native-runtime/
          if-no-files-found: error
          retention-days: 30
