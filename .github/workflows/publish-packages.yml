name: Publish Rust, Python, and Ruby packages

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry group to publish from the selected release tag
        required: true
        type: choice
        options: [all, crates, pypi, rubygems]
        default: all
      confirm_publish:
        description: Confirm irreversible package publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-gate:
    if: inputs.confirm_publish == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated release tag and published GitHub release identity
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git cat-file -t "refs/tags/v$version")" = tag
          tag_commit="$(git rev-parse "refs/tags/v$version^{}")"
          test "$tag_commit" = "$GITHUB_SHA"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$tmp"
          python3 - "$tmp/release-manifest.json" "$version" "$GITHUB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data.get("version") == sys.argv[2], data
          assert data.get("commit") == sys.argv[3], data
          print("Release manifest matches selected annotated tag and commit")
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-crates:
    needs: release-gate
    if: needs.release-gate.result == 'success' && (inputs.registry == 'all' || inputs.registry == 'crates')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Publish crates in dependency order (skip existing versions)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: python3 .github/scripts/publish_crates.py

  publish-pypi:
    needs: release-gate
    if: needs.release-gate.result == 'success' && (inputs.registry == 'all' || inputs.registry == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and validate Python source distribution
        run: |
          python -m pip install --upgrade maturin twine
          mkdir -p dist/python
          maturin sdist --manifest-path crates/nexusq-py/Cargo.toml --out dist/python
          python -m twine check dist/python/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist/python/*

  publish-rubygems:
    needs: release-gate
    if: needs.release-gate.result == 'success' && (inputs.registry == 'all' || inputs.registry == 'rubygems')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build Ruby gem
        run: mkdir -p dist && gem build bindings/ruby/nexusq.gemspec --output dist/nexusq.gem
      - name: Publish to RubyGems (skip an already-published version)
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-gate.outputs.version }}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://rubygems.org/api/v2/rubygems/nexusq/versions/$version.json")"
          case "$status" in
            200) echo "nexusq $version already exists on RubyGems; skipping." ;;
            404) gem push dist/nexusq.gem --host https://rubygems.org ;;
            *) echo "RubyGems version check returned HTTP $status; refusing to publish." >&2; exit 1 ;;
          esac
