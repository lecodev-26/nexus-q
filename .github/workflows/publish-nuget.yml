name: Publish NuGet

# Pushes the Nexusq .NET binding package (bindings/dotnet) to nuget.org.
# The corresponding API key policy on nuget.org is bound to this exact
# workflow file and repository (GitHub Actions), so the push is only
# accepted from this workflow.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["NEXUS-Q Sequential CI Pipeline"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read

jobs:
  ci-publication-gate:
    name: Confirm full CI passed before publishing
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Require the full sequential CI pipeline to pass
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != workflow_run ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CI_CONCLUSION" == success && -n "$CI_RUN_ID" ]] || exit 0
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("Phase 11 — Final sequential four-hour fuzz campaigns /")) | .conclusion] | if length == 3 and all(.[]; . == "success") then "success" else "not-success" end')
          # All three four-hour campaigns must have run and passed. If the full
          # pipeline was skipped (docs-only), do not build or publish a package.
          [[ "$conclusion" == success ]] || exit 0
          echo "publish=true" >> "$GITHUB_OUTPUT"

  sdk-runtime:
    needs: ci-publication-gate
    if: needs.ci-publication-gate.outputs.publish == 'true'
    name: Build RID-specific RustCrypto SDK runtime assets
    uses: ./.github/workflows/sdk-runtime.yml
    permissions:
      contents: read

  publish:
    needs: [ci-publication-gate, sdk-runtime]
    if: needs.ci-publication-gate.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Download validated native runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nexusq-sdk-runtime-*
          path: native-runtimes
          merge-multiple: false

      - name: Stage native assets in NuGet RID layout
        shell: bash
        run: |
          set -euo pipefail
          root=bindings/dotnet/src/Nexusq/runtimes
          mkdir -p "$root/linux-x64/native" "$root/linux-arm64/native" \
            "$root/osx-arm64/native" "$root/win-x64/native"
          cp native-runtimes/nexusq-sdk-runtime-x86_64-unknown-linux-gnu/lib/libnexusq.so "$root/linux-x64/native/"
          cp native-runtimes/nexusq-sdk-runtime-aarch64-unknown-linux-gnu/lib/libnexusq.so "$root/linux-arm64/native/"
          cp native-runtimes/nexusq-sdk-runtime-aarch64-apple-darwin/lib/libnexusq.dylib "$root/osx-arm64/native/"
          cp native-runtimes/nexusq-sdk-runtime-x86_64-pc-windows-msvc/lib/nexusq.dll "$root/win-x64/native/"

      - name: Pack NuGet package with native assets
        run: dotnet pack bindings/dotnet/src/Nexusq -c Release

      - name: Verify NuGet package contains all supported native RIDs
        shell: bash
        run: |
          set -euo pipefail
          package=$(find bindings/dotnet/src/Nexusq/bin/Release -maxdepth 1 -name '*.nupkg' -print -quit)
          test -n "$package"
          unzip -l "$package" | grep -F 'runtimes/linux-x64/native/libnexusq.so'
          unzip -l "$package" | grep -F 'runtimes/linux-arm64/native/libnexusq.so'
          unzip -l "$package" | grep -F 'runtimes/osx-arm64/native/libnexusq.dylib'
          unzip -l "$package" | grep -F 'runtimes/win-x64/native/nexusq.dll'

      - name: NuGet login (Trusted Publishing via OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push bindings/dotnet/src/Nexusq/bin/Release/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
