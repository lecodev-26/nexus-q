name: Publish NuGet (OIDC)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm publication to nuget.org from the exact release tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-gate:
    if: inputs.confirm_publish == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated tag and GitHub release manifest
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git cat-file -t "refs/tags/v$version")" = tag
          test "$(git rev-parse "refs/tags/v$version^{}")" = "$GITHUB_SHA"
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$tmp"
          python3 - "$tmp/release-manifest.json" "$version" "$GITHUB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          assert data.get('version') == sys.argv[2], data
          assert data.get('commit') == sys.argv[3], data
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"

  sdk-runtime:
    needs: release-gate
    if: needs.release-gate.result == 'success'
    uses: ./.github/workflows/sdk-runtime.yml
    permissions:
      contents: read

  publish:
    needs: [release-gate, sdk-runtime]
    if: needs.release-gate.result == 'success' && needs.sdk-runtime.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      - name: Download validated RustCrypto runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nexusq-sdk-runtime-*
          path: native-runtimes
          merge-multiple: false
      - name: Stage supported runtime identifiers
        shell: bash
        run: |
          set -euo pipefail
          root=bindings/dotnet/src/Nexusq/runtimes
          mkdir -p "$root/linux-x64/native" "$root/linux-arm64/native" "$root/osx-arm64/native" "$root/win-x64/native"
          cp native-runtimes/nexusq-sdk-runtime-x86_64-unknown-linux-gnu/lib/libnexusq.so "$root/linux-x64/native/"
          cp native-runtimes/nexusq-sdk-runtime-aarch64-unknown-linux-gnu/lib/libnexusq.so "$root/linux-arm64/native/"
          cp native-runtimes/nexusq-sdk-runtime-aarch64-apple-darwin/lib/libnexusq.dylib "$root/osx-arm64/native/"
          cp native-runtimes/nexusq-sdk-runtime-x86_64-pc-windows-msvc/lib/nexusq.dll "$root/win-x64/native/"
      - name: Pack and verify NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack bindings/dotnet/src/Nexusq -c Release
          package=$(find bindings/dotnet/src/Nexusq/bin/Release -maxdepth 1 -name '*.nupkg' -print -quit)
          test -n "$package"
          unzip -l "$package" | grep -F 'runtimes/linux-x64/native/libnexusq.so'
          unzip -l "$package" | grep -F 'runtimes/linux-arm64/native/libnexusq.so'
          unzip -l "$package" | grep -F 'runtimes/osx-arm64/native/libnexusq.dylib'
          unzip -l "$package" | grep -F 'runtimes/win-x64/native/nexusq.dll'
      - name: NuGet trusted publishing login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: |
          dotnet nuget push bindings/dotnet/src/Nexusq/bin/Release/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
