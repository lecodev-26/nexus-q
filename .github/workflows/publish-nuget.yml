name: Publish NuGet

# Pushes the Nexusq .NET binding package (bindings/dotnet) to nuget.org.
# The corresponding API key policy on nuget.org is bound to this exact
# workflow file and repository (GitHub Actions), so the push is only
# accepted from this workflow.

on:
  workflow_dispatch:
    inputs:
      confirm_release_identity:
        description: "Confirm the release identity decision has been reviewed"
        required: true
        type: boolean
        default: false
      approved_release_commit:
        description: "Full 40-character commit SHA approved for this version"
        required: true
        type: string
permissions:
  contents: read

jobs:
  release-identity-gate:
    name: Verify explicit release identity approval
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require approved tag, commit, and clean source tree
        id: gate
        env:
          CONFIRM: ${{ inputs.confirm_release_identity }}
          REPO_APPROVAL: ${{ vars.NEXUSQ_RELEASE_IDENTITY_APPROVED }}
          APPROVED_COMMIT: ${{ inputs.approved_release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          [[ "$CONFIRM" == "true" ]] || { echo "::error::Explicit release identity confirmation is required."; exit 1; }
          [[ "$REPO_APPROVAL" == "true" ]] || { echo "::error::Repository approval variable is not enabled by a maintainer."; exit 1; }
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "::error::NuGet publication must run from a version tag, not a branch."; exit 1; }
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::Tag $GITHUB_REF_NAME does not match Cargo workspace version $version."; exit 1; }
          export NEXUSQ_RELEASE_IDENTITY_APPROVED=true
          export NEXUSQ_APPROVED_RELEASE_COMMIT="$APPROVED_COMMIT"
          python3 .github/scripts/verify_release_identity.py "$version"
          echo "approved=true" >> "$GITHUB_OUTPUT"

  sdk-runtime:
    needs: release-identity-gate
    if: needs.release-identity-gate.outputs.approved == 'true'
    name: Build RID-specific RustCrypto SDK runtime assets
    uses: ./.github/workflows/sdk-runtime.yml
    permissions:
      contents: read

  publish:
    needs: [release-identity-gate, sdk-runtime]
    if: needs.release-identity-gate.outputs.approved == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Download validated native runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nexusq-sdk-runtime-*
          path: native-runtimes
          merge-multiple: false

      - name: Stage native assets in NuGet RID layout
        shell: bash
        run: |
          set -euo pipefail
          root=bindings/dotnet/src/Nexusq/runtimes
          mkdir -p "$root/linux-x64/native" "$root/linux-arm64/native" \
            "$root/osx-arm64/native" "$root/win-x64/native"
          cp native-runtimes/nexusq-sdk-runtime-x86_64-unknown-linux-gnu/lib/libnexusq.so "$root/linux-x64/native/"
          cp native-runtimes/nexusq-sdk-runtime-aarch64-unknown-linux-gnu/lib/libnexusq.so "$root/linux-arm64/native/"
          cp native-runtimes/nexusq-sdk-runtime-aarch64-apple-darwin/lib/libnexusq.dylib "$root/osx-arm64/native/"
          cp native-runtimes/nexusq-sdk-runtime-x86_64-pc-windows-msvc/lib/nexusq.dll "$root/win-x64/native/"

      - name: Pack NuGet package with native assets
        run: dotnet pack bindings/dotnet/src/Nexusq -c Release

      - name: Verify NuGet package contains all supported native RIDs
        shell: bash
        run: |
          set -euo pipefail
          package=$(find bindings/dotnet/src/Nexusq/bin/Release -maxdepth 1 -name '*.nupkg' -print -quit)
          test -n "$package"
          unzip -l "$package" | grep -F 'runtimes/linux-x64/native/libnexusq.so'
          unzip -l "$package" | grep -F 'runtimes/linux-arm64/native/libnexusq.so'
          unzip -l "$package" | grep -F 'runtimes/osx-arm64/native/libnexusq.dylib'
          unzip -l "$package" | grep -F 'runtimes/win-x64/native/nexusq.dll'

      - name: NuGet login (Trusted Publishing via OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push bindings/dotnet/src/Nexusq/bin/Release/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
