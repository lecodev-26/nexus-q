name: NEXUS-Q Manual Rust Dependency Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusq-manual-rust-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo-audit and cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Audit workspace dependency lockfile
        run: cargo audit --file Cargo.lock
      - name: Audit native backend dependency lockfile
        run: cargo audit --file crates/nexusq-native-backend/Cargo.lock
      - name: Audit native runner dependency lockfile
        run: cargo audit --file arena/runners/nexusq-native/Cargo.lock
      - name: Check dependency policy
        run: cargo deny check
