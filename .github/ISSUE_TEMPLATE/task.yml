name: Engineering task
description: Propose a scoped maintenance, engineering, or research task.
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this task deliver?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected areas
      description: Identify crates, workflows, docs, APIs, or platforms where known.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, compatibility, and dependencies
      description: Note threat-model, migration, dependency, or operational concerns.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This task does not disclose a vulnerability or sensitive information.
          required: true
