[package]
name = "nexusq-wasm"
description = "WebAssembly bridge for the NEXUS-Q post-quantum cryptographic core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexusq-core = { workspace = true }
zeroize = { workspace = true }

# Keep browser bindings and JS RNG backends out of native builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints.rust]
unsafe_code = "forbid"
