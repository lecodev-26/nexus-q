[package]
name = "nexusq-core"
description = "Core library for NEXUS-Q"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Experimental native ML-KEM/ML-DSA implementation. Explicit opt-in only.
native-backend = ["dep:nexusq-native-backend"]
# Exercises the same API using the backend's portable C implementation only.
native-backend-portable = ["native-backend", "nexusq-native-backend/portable-only"]

[dependencies]
nexusq-native-backend = { path = "../nexusq-native-backend", version = "0.1.0", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
ml-kem = { workspace = true }
ml-dsa = { workspace = true }
slh-dsa = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
hybrid-array = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
getrandom = { workspace = true }
crc32c = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
ml-dsa = { workspace = true }
ml-kem = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "crypto_baseline"
harness = false
