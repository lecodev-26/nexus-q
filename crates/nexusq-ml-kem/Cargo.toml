[package]
name = "nexusq-ml-kem"
description = """
NEXUS-Q fork of the pure Rust ML-KEM (FIPS 203, formerly Kyber) implementation
from RustCrypto, with optional NEXUS-Q kernel integration
"""
version = "4.1.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/lecodev-26/nexus-q"
categories = ["cryptography", "no-std"]
keywords = ["crypto", "kyber", "lattice", "post-quantum"]
exclude = ["tests/key-gen.rs", "tests/key-gen.json", "tests/encap-decap.rs", "tests/encap-decap.json"]

[lib]
name = "ml_kem"

[features]
default = ["alloc"]
alloc = ["module-lattice/alloc", "pkcs8?/alloc"]

getrandom = ["kem/getrandom"]
hazmat = []
pem = ["pkcs8/pem"]
pkcs8 = ["dep:const-oid", "dep:pkcs8"]
zeroize = ["module-lattice/zeroize", "dep:zeroize"]
nexusq-kernels = ["dep:nexusq-kernels"]
experimental-kernels = ["nexusq-kernels/experimental-avx2"]

[dependencies]
array = { version = "0.4.8", package = "hybrid-array", features = ["ctutils", "extra-sizes"] }
module-lattice = { version = "0.2.3", features = ["ctutils"] }
kem = "0.3"
rand_core = "0.10"
sha3 = { version = "0.11", default-features = false }
nexusq-kernels = { version = "4.1.2", optional = true }

# optional dependencies
const-oid = { version = "0.10.1", optional = true, default-features = false, features = ["db"] }
pkcs8 = { version = "0.11", optional = true, default-features = false }
zeroize = { version = "1.8.1", optional = true, default-features = false }

[dev-dependencies]
criterion = "0.7"
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = { version = "0.4.3", features = ["serde"] }
hex-literal = "1"
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint"] }
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"

[[bench]]
name = "mlkem"
harness = false

[package.metadata.docs.rs]
all-features = true
