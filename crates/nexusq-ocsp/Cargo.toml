[package]
name = "nexusq-ocsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Post-quantum OCSP response and X.509 CRL issuance for NexusQ"

[dependencies]
der = { version = "0.8", features = ["std", "pem"] }
const-oid = { version = "0.10", features = ["db"] }
sha1 = "0.11.0-rc.5"
sha2 = { workspace = true }
signature = "3"
spki = "0.8"
x509-cert = { version = "0.3.0", features = ["std", "pem", "builder", "signature"] }
nexusq-ml-dsa = { workspace = true, features = ["pkcs8", "getrandom", "zeroize"] }
thiserror = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
rand = "0.10"
tower = { workspace = true }
http-body-util = "0.1"
tokio = { workspace = true }
