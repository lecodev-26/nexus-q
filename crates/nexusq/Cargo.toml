[package]
name = "nexusq"
description = "Metacrate for NEXUS-Q: pulls in the full Rust library stack (core, kernels, ML-KEM, ML-DSA) with one dependency"
version = "4.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
nexusq-core = { version = "4.1.0" }
nexusq-kernels = { version = "4.1.0" }
nexusq_ml_kem = { package = "nexusq-ml-kem", version = "4.1.0" }
nexusq_ml_dsa = { package = "nexusq-ml-dsa", version = "4.1.0" }
