    .actions{display:flex;flex-wrap:wrap;gap:12px}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-weight:600}
    .actions a.primary{background:var(--acc);border-color:var(--acc);color:#04110e}
    a:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
    @media(prefers-reduced-motion:no-preference){.actions a{transition:transform .18s,border-color .18s}.actions a:hover{transform:translateY(-2px);border-color:var(--acc)}}
