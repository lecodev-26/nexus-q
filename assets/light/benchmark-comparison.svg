<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">NEXUS-Q native backend versus AWS-LC median latency ratios</title>
<desc id="desc">Nine measured operations from the documented v4.1.0 hosted-runner release gate. Ratio is NEXUS-Q median divided by AWS-LC median. Values below 1.0 indicate lower median latency for NEXUS-Q in this run; values above 1.0 indicate higher median latency. The native backend is experimental and opt-in.</desc>
