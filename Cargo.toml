[workspace]
resolver = "3"
exclude = ["arena/runners/nexusq"]
members = [
    "crates/nexusq-core",
    "crates/nexusq-cli",
    "crates/nexusq-server",
    "crates/nexusq-c",
    "crates/nexusq-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["lecodev-26 <325287752+lecodev-26@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lecodev-26/nexusq"

[workspace.dependencies]
nexusq-core = { path = "crates/nexusq-core", version = "0.1.0" }

thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"

zeroize = { version = "1", features = ["derive", "serde"] }
subtle = "2"
sha2 = { version = "0.11.0-rc.5", features = ["zeroize"] }
sha3 = { version = "0.11.0-rc.5", features = ["zeroize"] }
argon2 = { version = "0.6.0-rc.1", features = ["zeroize"] }
hkdf = "0.13.0-rc.5"
hmac = { version = "0.13", features = ["zeroize"] }
aes-gcm = { version = "0.11.0-rc.5", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0-rc.5", features = ["zeroize"] }
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
slh-dsa = { version = "0.2.0-rc.5", features = ["zeroize"] }
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.9", features = ["os_rng"] }
hybrid-array = "0.4"

getrandom = "0.3"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
rpassword = "7"
crc32c = "0.6"
hex = "0.4"
base64 = "0.22"

proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true

[profile.test]
opt-level = 1
debug = 2
overflow-checks = true
