# cargo-deny policy for NEXUS-Q release and CI gates.
# Keep the policy explicit so dependency changes fail closed.

[advisories]
version = 2
# No upstream fix exists yet. RUSTSEC-2023-0071 concerns RSA private-key
# decryption timing; Nexus-Q uses cms only for ContentInfo parsing and ML-DSA
# SignedData construction, not RSA private-key decryption. Revisit on CMS/RSA updates.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "See docs/adr/0005-rustsec-2023-0071-rsa-advisory.md: transitive CMS builder dependency; current documented paths do not perform RSA private-key decryption; reassess on dependency or code-path changes." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
