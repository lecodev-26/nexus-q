# cargo-deny policy for NEXUS-Q release and CI gates.
# Keep the policy explicit so dependency changes fail closed.

[advisories]
version = 2
# Temporary scoped exception; see docs/adr/0005-rsa-cms-rustsec-2023-0071.md.
# The ADR records the current call-site review and required reassessment triggers.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Temporary scoped exception documented in docs/adr/0005-rsa-cms-rustsec-2023-0071.md; reviewed paths use CMS parsing and ML-DSA SignedData construction, not RSA private-key decryption; reassess on dependency or call-site changes." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
