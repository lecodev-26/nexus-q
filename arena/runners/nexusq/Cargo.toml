[package]
name = "nexusq-arena-runner"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cached-verifier = []
# Benchmark the public nexusq-core crypto API with the production feature boundary.
native-backend = ["nexusq-core/native-backend"]
native-backend-portable = ["nexusq-core/native-backend-portable"]
# Explicitly opt in to the experimental SHAKE x4 path for differential tests and Arena.
experimental-kernels = ["ml-dsa/experimental-kernels", "ml-kem/experimental-kernels"]

[dependencies]
nexusq-core = { path = "../../../crates/nexusq-core" }
ml-dsa = { version = "0.1.1", features = ["nexusq-kernels"] }
ml-kem = "0.3.2"
serde_json = "1"

# Keep the standalone Arena runner on the exact PQC sources tested by the
# main workspace; this manifest is excluded from the root workspace.
[patch.crates-io]
ml-dsa = { path = "../../../vendor/ml-dsa" }
nexusq-kernels = { path = "../../../crates/nexusq-kernels" }
ml-kem = { path = "../../../vendor/ml-kem" }
module-lattice = { path = "../../../vendor/module-lattice" }

# Match the workspace production release profile. This package is excluded from
# the root workspace, so without an explicit profile cargo uses the defaults
# (no LTO, many codegen-units) and the production-path gate under-measures us
# against AWS-LC built with -O3.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
